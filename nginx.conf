events {}

http {
    resolver 127.0.0.11 valid=30s;

    # Politica de cache (unica fuente de verdad). Se evalua al responder, asi
    # que depende de la ruta y del codigo de estado. Por defecto: no-store
    # (HTML, *.data, /api, errores). Solo se cachea lo que se lista abajo.
    # El primer patron que coincide gana.
    map "$status:$uri" $cache_control {
        default                                  "no-store";
        # version.json: nunca cacheado, con ningun estado
        ~^\d+:/version\.json$                    "no-store, no-cache, must-revalidate";
        # Assets con hash (build/client/assets): inmutables, solo si 200/304
        # Exige un archivo con extension dentro de /assets/ (el build genera
        # una sola carpeta plana); sin "/assets/" pelado ni rutas sin extension.
        ~^(200|304):/assets/[^/]+\.[A-Za-z0-9]+$   "public, max-age=31536000, immutable";
        # Favicon y estaticos sin hash: revalidar siempre
        ~^(200|304):/(favicon\.ico|robots\.txt|manifest\.json|site\.webmanifest|apple-touch-icon\.png)$ "public, max-age=0, must-revalidate";
    }

    server {
        listen 80;
        server_name servidorossa.ddns.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name servidorossa.ddns.net;

        ssl_certificate /etc/letsencrypt/live/servidorossa.ddns.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/servidorossa.ddns.net/privkey.pem;

        # Cabeceras comunes. IMPORTANTE: add_header se hereda a los location
        # SOLO si el location no define ningun add_header propio; por eso los
        # location de abajo no usan add_header.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS desactivado a proposito: activar solo cuando la renovacion
        # automatica del certificado este probada; el navegador forzara HTTPS
        # durante max-age y es dificil de revertir.
        # add_header Strict-Transport-Security "max-age=15552000" always;

	location / {
            proxy_pass http://ssr:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # El upstream no decide la cache: la fija el map de arriba.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
        }

        location /api/ws/socket.io/ {
            proxy_pass http://backend:3001/api/ws/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # El upstream no decide la cache: la fija el map de arriba.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
        }

        location /api/ {
            proxy_pass http://backend:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # El upstream no decide la cache: la fija el map de arriba.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
        }
    }
}